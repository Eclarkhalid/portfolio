<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Token layers</title>
  <desc id="d">Raw values feed semantic tokens, semantic tokens feed components, and components build screens. Components only reference semantic tokens.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; fill: #262626; }
    .kicker { font-size: 14px; font-weight: 600;  fill: #0369a1; }
    .num { font-size: 12px; font-weight: 600; fill: #0369a1; }
    .title { font-size: 20px; font-weight: 600; fill: #171717; }
    .body { font-size: 14px; fill: #404040; }
    .mono { font-size: 13px; fill: #525252; font-family: "Cascadia Code", Consolas, "SF Mono", monospace; }
    .chip { font-size: 13px; font-weight: 500; }
  </style>
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="40" y="58" class="kicker">From values to screens</text>

  <g fill="#fafafa" stroke="#d4d4d4">
    <rect x="40" y="90" width="250" height="510" rx="16"/>
    <rect x="330" y="90" width="250" height="510" rx="16"/>
    <rect x="620" y="90" width="250" height="510" rx="16"/>
    <rect x="910" y="90" width="250" height="510" rx="16"/>
  </g>
  <g fill="none" stroke="#737373" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M298 345h24M316 339l6 6-6 6"/>
    <path d="M588 345h24M606 339l6 6-6 6"/>
    <path d="M878 345h24M896 339l6 6-6 6"/>
  </g>

  <!-- 1 -->
  <text x="64" y="132" class="num">01</text>
  <text x="64" y="162" class="title">Raw values</text>
  <text x="64" y="186" class="body">What the brand is made of</text>
  <g>
    <circle cx="74" cy="236" r="10" fill="#2563eb"/><text x="96" y="241" class="mono">#2563EB</text>
    <circle cx="74" cy="272" r="10" fill="#16a34a"/><text x="96" y="277" class="mono">#16A34A</text>
    <circle cx="74" cy="308" r="10" fill="#f5f5f5" stroke="#d4d4d4"/><text x="96" y="313" class="mono">#F5F5F5</text>
    <rect x="64" y="334" width="20" height="20" rx="6" fill="none" stroke="#a3a3a3" stroke-width="1.5"/><text x="96" y="349" class="mono">0.875rem</text>
    <text x="64" y="392" class="mono">Inter 400 / 500 / 600</text>
    <text x="64" y="416" class="mono">4px spacing steps</text>
  </g>
  <text x="64" y="552" class="body">Never used directly</text>
  <text x="64" y="572" class="body">by a component</text>

  <!-- 2 -->
  <text x="354" y="132" class="num">02</text>
  <text x="354" y="162" class="title">Semantic tokens</text>
  <text x="354" y="186" class="body">What each value means</text>
  <g fill="#ffffff" stroke="#d4d4d4">
    <rect x="354" y="218" width="202" height="32" rx="8"/>
    <rect x="354" y="258" width="202" height="32" rx="8"/>
    <rect x="354" y="298" width="202" height="32" rx="8"/>
    <rect x="354" y="338" width="202" height="32" rx="8"/>
    <rect x="354" y="378" width="202" height="32" rx="8"/>
  </g>
  <text x="370" y="239" class="mono">primary</text>
  <text x="370" y="279" class="mono">success-soft</text>
  <text x="370" y="319" class="mono">muted-foreground</text>
  <text x="370" y="359" class="mono">border</text>
  <text x="370" y="399" class="mono">radius-lg</text>
  <text x="354" y="532" class="body">Each has a light and</text>
  <text x="354" y="552" class="body">a dark value, so dark</text>
  <text x="354" y="572" class="body">mode comes for free</text>

  <!-- 3 -->
  <text x="644" y="132" class="num">03</text>
  <text x="644" y="162" class="title">Components</text>
  <text x="644" y="186" class="body">Built only from tokens</text>
  <g>
    <rect x="644" y="218" width="124" height="34" rx="17" fill="#262626"/><text x="666" y="240" class="chip" style="fill:#ffffff">Save changes</text>
    <rect x="644" y="266" width="112" height="28" rx="14" fill="#f0fdf4" stroke="#dcfce7"/><circle cx="660" cy="280" r="3.5" fill="#16a34a"/><text x="671" y="285" class="chip" style="fill:#3f6212;font-size:12px">Approved</text>
    <rect x="644" y="310" width="202" height="104" rx="10" fill="#ffffff" stroke="#d4d4d4"/>
    <line x1="644" y1="345" x2="846" y2="345" stroke="#e5e5e5"/>
    <line x1="644" y1="380" x2="846" y2="380" stroke="#e5e5e5"/>
    <rect x="660" y="323" width="80" height="8" rx="4" fill="#e5e5e5"/>
    <rect x="660" y="358" width="110" height="8" rx="4" fill="#f0f0f0"/>
    <rect x="660" y="393" width="64" height="8" rx="4" fill="#f0f0f0"/>
  </g>
  <text x="644" y="532" class="body">No hex codes, no</text>
  <text x="644" y="552" class="body">one-off sizes in the</text>
  <text x="644" y="572" class="body">component source</text>

  <!-- 4 -->
  <text x="934" y="132" class="num">04</text>
  <text x="934" y="162" class="title">Screens</text>
  <text x="934" y="186" class="body">Composed from components</text>
  <g>
    <rect x="934" y="218" width="202" height="196" rx="10" fill="#ffffff" stroke="#d4d4d4"/>
    <line x1="974" y1="218" x2="974" y2="414" stroke="#d4d4d4"/>
    <rect x="946" y="232" width="16" height="4" rx="2" fill="#d4d4d4"/>
    <rect x="946" y="244" width="16" height="4" rx="2" fill="#e5e5e5"/>
    <rect x="946" y="256" width="16" height="4" rx="2" fill="#e5e5e5"/>
    <rect x="988" y="234" width="84" height="9" rx="4.5" fill="#d4d4d4"/>
    <rect x="988" y="256" width="134" height="40" rx="8" fill="#fafafa" stroke="#e5e5e5"/>
    <line x1="988" y1="318" x2="1122" y2="318" stroke="#e5e5e5"/>
    <line x1="988" y1="348" x2="1122" y2="348" stroke="#e5e5e5"/>
    <line x1="988" y1="378" x2="1122" y2="378" stroke="#e5e5e5"/>
    <rect x="988" y="328" width="62" height="7" rx="3.5" fill="#e5e5e5"/><circle cx="1110" cy="331" r="3.5" fill="#16a34a"/>
    <rect x="988" y="358" width="78" height="7" rx="3.5" fill="#f0f0f0"/><circle cx="1110" cy="361" r="3.5" fill="#d97706"/>
    <rect x="988" y="388" width="52" height="7" rx="3.5" fill="#f0f0f0"/><circle cx="1110" cy="391" r="3.5" fill="#2563eb"/>
  </g>
  <text x="934" y="532" class="body">Change a token and</text>
  <text x="934" y="552" class="body">every screen follows</text>
  <text x="934" y="572" class="body">in light and dark</text>
</svg>
