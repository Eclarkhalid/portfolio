<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">One status language</title>
  <desc id="d">Five meanings, each with one colour family and one word: completed in green, review needed in amber, in progress in blue, failed in red and not started in grey. The word always appears with the colour.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; fill: #262626; }
    .kicker { font-size: 14px; font-weight: 600;  fill: #0369a1; }
    .head { font-size: 13px; font-weight: 600;  fill: #525252; }
    .meaning { font-size: 17px; font-weight: 600; fill: #171717; }
    .body { font-size: 14px; fill: #404040; }
    .pill { font-size: 14px; font-weight: 500; }
  </style>
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="60" y="64" class="kicker">One status language</text>

  <text x="60" y="122" class="head">Meaning</text>
  <text x="400" y="122" class="head">On every screen</text>
  <text x="680" y="122" class="head">Used for</text>
  <line x1="60" y1="140" x2="1140" y2="140" stroke="#d4d4d4"/>

  <g>
    <text x="60" y="198" class="meaning">Done</text>
    <rect x="400" y="176" width="132" height="32" rx="16" fill="#f0fdf4" stroke="#dcfce7"/>
    <circle cx="420" cy="192" r="4" fill="#16a34a"/>
    <text x="432" y="197" class="pill" style="fill:#3f6212">Approved</text>
    <text x="680" y="197" class="body">Completed, approved, healthy</text>
    <line x1="60" y1="238" x2="1140" y2="238" stroke="#e5e5e5"/>
  </g>
  <g>
    <text x="60" y="290" class="meaning">Needs attention</text>
    <rect x="400" y="268" width="156" height="32" rx="16" fill="#fffbeb" stroke="#fef3c7"/>
    <circle cx="420" cy="284" r="4" fill="#d97706"/>
    <text x="432" y="289" class="pill" style="fill:#854d0e">Review needed</text>
    <text x="680" y="289" class="body">Review needed, due soon</text>
    <line x1="60" y1="330" x2="1140" y2="330" stroke="#e5e5e5"/>
  </g>
  <g>
    <text x="60" y="382" class="meaning">Moving</text>
    <rect x="400" y="360" width="136" height="32" rx="16" fill="#eff6ff" stroke="#dbeafe"/>
    <circle cx="420" cy="376" r="4" fill="#2563eb"/>
    <text x="432" y="381" class="pill" style="fill:#1e3a8a">In progress</text>
    <text x="680" y="381" class="body">In progress, sent, information</text>
    <line x1="60" y1="422" x2="1140" y2="422" stroke="#e5e5e5"/>
  </g>
  <g>
    <text x="60" y="474" class="meaning">Stopped</text>
    <rect x="400" y="452" width="112" height="32" rx="16" fill="#fef2f2" stroke="#fee2e2"/>
    <circle cx="420" cy="468" r="4" fill="#dc2626"/>
    <text x="432" y="473" class="pill" style="fill:#7f1d1d">Overdue</text>
    <text x="680" y="473" class="body">Failed, overdue, destructive</text>
    <line x1="60" y1="514" x2="1140" y2="514" stroke="#e5e5e5"/>
  </g>
  <g>
    <text x="60" y="566" class="meaning">Waiting</text>
    <rect x="400" y="544" width="136" height="32" rx="16" fill="#fafafa" stroke="#d4d4d4"/>
    <circle cx="420" cy="560" r="4" fill="#737373"/>
    <text x="432" y="565" class="pill" style="fill:#525252">Not started</text>
    <text x="680" y="565" class="body">Not started, inactive</text>
  </g>

  <text x="60" y="630" class="body">Colour reinforces the word and never replaces it. The soft ground, the dot and the text colour are fixed tokens per meaning.</text>
</svg>
