<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">What a brand preset may change</title>
  <desc id="d">A preset changes the primary colour and the corner radius. Status colours and chart colours stay the same in every preset, so meaning never changes with the brand.</desc>
  <style>
    text { font-family: Inter, "Segoe UI", system-ui, -apple-system, sans-serif; fill: #262626; }
    .kicker { font-size: 14px; font-weight: 600;  fill: #0369a1; }
    .title { font-size: 21px; font-weight: 600; fill: #171717; }
    .body { font-size: 14px; fill: #404040; }
    .label { font-size: 13px; font-weight: 500; fill: #525252; }
    .btn { font-size: 13px; font-weight: 500; fill: #404040; }
  </style>
  <rect width="1200" height="675" fill="#ffffff"/>

  <!-- left -->
  <rect x="40" y="40" width="545" height="595" rx="16" fill="#fafafa" stroke="#d4d4d4"/>
  <text x="76" y="90" class="kicker">Changes with the preset</text>
  <text x="76" y="128" class="title">Brand: primary and shape</text>
  <text x="76" y="154" class="body">An organization picks the look of its workspace.</text>

  <text x="76" y="212" class="label">Primary colour</text>
  <g>
    <circle cx="92" cy="246" r="14" fill="#2563eb"/>
    <circle cx="130" cy="246" r="14" fill="#059669"/>
    <circle cx="168" cy="246" r="14" fill="#7c3aed"/>
    <circle cx="206" cy="246" r="14" fill="#ea580c"/>
    <circle cx="244" cy="246" r="14" fill="#65a30d"/>
    <circle cx="282" cy="246" r="14" fill="#3f3f46"/>
  </g>

  <text x="76" y="320" class="label">Corner radius</text>
  <g>
    <rect x="76" y="334" width="128" height="36" rx="12" fill="#ffffff" stroke="#d4d4d4"/><text x="100" y="357" class="btn">Save changes</text>
    <rect x="220" y="334" width="128" height="36" rx="6" fill="#ffffff" stroke="#d4d4d4"/><text x="244" y="357" class="btn">Save changes</text>
    <rect x="364" y="334" width="128" height="36" rx="0" fill="#ffffff" stroke="#d4d4d4"/><text x="388" y="357" class="btn">Save changes</text>
  </g>

  <text x="76" y="430" class="label">Readable text on any primary</text>
  <g>
    <rect x="76" y="444" width="128" height="36" rx="10" fill="#2563eb"/><text x="100" y="467" class="btn" style="fill:#ffffff">Save changes</text>
    <rect x="220" y="444" width="128" height="36" rx="10" fill="#a3e635"/><text x="244" y="467" class="btn" style="fill:#1a2e05">Save changes</text>
  </g>
  <text x="76" y="548" class="body">Every light value has a matching dark value, and</text>
  <text x="76" y="570" class="body">button text keeps its contrast on bright primaries.</text>

  <!-- right -->
  <rect x="615" y="40" width="545" height="595" rx="16" fill="#ffffff" stroke="#d4d4d4"/>
  <text x="651" y="90" class="kicker">Never changes</text>
  <text x="651" y="128" class="title">Meaning: status and data</text>
  <text x="651" y="154" class="body">The same in every preset, light and dark.</text>

  <text x="651" y="212" class="label">Status</text>
  <g>
    <rect x="651" y="226" width="106" height="28" rx="14" fill="#f0fdf4" stroke="#dcfce7"/><circle cx="667" cy="240" r="3.5" fill="#16a34a"/><text x="678" y="245" class="btn" style="fill:#3f6212;font-size:12px">Approved</text>
    <rect x="765" y="226" width="126" height="28" rx="14" fill="#fffbeb" stroke="#fef3c7"/><circle cx="781" cy="240" r="3.5" fill="#d97706"/><text x="792" y="245" class="btn" style="fill:#854d0e;font-size:12px">Review needed</text>
    <rect x="899" y="226" width="110" height="28" rx="14" fill="#eff6ff" stroke="#dbeafe"/><circle cx="915" cy="240" r="3.5" fill="#2563eb"/><text x="926" y="245" class="btn" style="fill:#1e3a8a;font-size:12px">In progress</text>
    <rect x="651" y="264" width="92" height="28" rx="14" fill="#fef2f2" stroke="#fee2e2"/><circle cx="667" cy="278" r="3.5" fill="#dc2626"/><text x="678" y="283" class="btn" style="fill:#7f1d1d;font-size:12px">Overdue</text>
  </g>

  <text x="651" y="342" class="label">Charts</text>
  <g>
    <rect x="651" y="356" width="300" height="120" rx="10" fill="#ffffff" stroke="#d4d4d4"/>
    <line x1="671" y1="456" x2="931" y2="456" stroke="#e5e5e5"/>
    <rect x="683" y="430" width="22" height="26" rx="3" fill="#3b82f6"/>
    <rect x="719" y="410" width="22" height="46" rx="3" fill="#8b5cf6"/>
    <rect x="755" y="420" width="22" height="36" rx="3" fill="#22c55e"/>
    <rect x="791" y="396" width="22" height="60" rx="3" fill="#f59e0b"/>
    <rect x="827" y="416" width="22" height="40" rx="3" fill="#06b6d4"/>
    <rect x="863" y="404" width="22" height="52" rx="3" fill="#f43f5e"/>
  </g>
  <text x="651" y="548" class="body">A green "Approved" means the same thing in</text>
  <text x="651" y="570" class="body">every organization, whatever its brand colour.</text>
</svg>
